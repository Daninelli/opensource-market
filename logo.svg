<svg xmlns="http://www.w3.org/2000/svg" viewBox="151 141 518 518" width="518" height="518">
    <!-- 原始画布是 800x800，笔画实际只占 x 175~645 / y 225~575，
         在 30px 的顶栏里只剩 18px 宽，细节全糊。
         这里把取景收到笔画外框 + 24px 呼吸边（518 见方的正方形），
         图形本身、配色、背景矩形都没有改动。 -->
    <rect width="800" height="800" fill="#FBFBF9"/>

    <!-- 右侧浅绿色箭头（最底层） -->
    <path d="M 520 280 L 645 400 L 520 520 L 520 440 L 570 400 L 520 360 Z" fill="#12B8A6"/>

    <!-- 左侧半圆弧内部青色部分 -->
    <path d="M 240 560 L 240 380 A 120 120 0 0 1 400 380 L 400 560 L 280 560 Z" fill="#10A5A0"/>

    <!-- 主体深绿色部分 -->
    <path d="M 200 260 L 420 260 L 420 225 L 475 225 A 25 25 0 0 1 495 235 L 645 400 L 495 565 A 25 25 0 0 1 475 575 L 415 575 L 415 380 A 90 90 0 0 0 230 380 L 230 575 L 200 575 A 25 25 0 0 1 175 550 L 175 285 A 25 25 0 0 1 200 260 Z" fill="#005A4F"/>

    <!-- 右侧浅绿色内嵌「&gt;」符号 -->
    <path d="M 475 315 A 18 18 0 0 1 500 315 L 560 395 A 18 18 0 0 1 560 425 L 500 505 A 18 18 0 0 1 475 505 L 465 490 A 18 18 0 0 1 465 460 L 515 410 L 465 350 A 18 18 0 0 1 465 330 Z" fill="#92E287"/>
</svg>
