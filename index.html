<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="开源集市：按分类整理可以直接用、也能轻松二次开发的开源成品应用，支持 GitHub 与 Gitee 双源，点按钮直达下载。">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>开源集市 · 开源成品应用集合</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-strong: #d3d7dd;
            --ink: #111827;
            --ink-soft: #374151;
            --muted: #6b7280;
            --faint: #9ca3af;
            --brand: #15803d;
            --brand-hover: #166534;
            --max-width: 1240px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink-soft);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- 图标 ---------- */
        .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            vertical-align: -0.125em;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- 页头 ---------- */
        .hero {
            background: linear-gradient(180deg, #ffffff 0%, #f3f7f4 100%);
            border-bottom: 1px solid var(--border);
            padding: 44px 20px 30px;
        }
        .hero-inner { max-width: var(--max-width); margin: 0 auto; text-align: center; }

        .logo-mark {
            width: 62px;
            height: 62px;
            margin: 0 auto;
            display: grid;
            place-items: center;
            font-size: 34px;
            color: var(--brand);
            background: linear-gradient(180deg, #f0fdf4, #dcfce7);
            border: 1px solid #bbf7d0;
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(21, 128, 61, .12);
        }

        .hero h1 {
            margin: 16px 0 0;
            font-size: 2.15rem;
            letter-spacing: -.02em;
            color: var(--ink);
        }
        .hero .tagline {
            margin: 10px auto 0;
            max-width: 680px;
            font-size: 15px;
            line-height: 1.7;
            color: var(--muted);
        }

        .stats {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 30px;
            margin: 26px 0 0;
            padding: 0;
        }
        .stats li { display: flex; align-items: baseline; gap: 7px; }
        .stats b { font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; }
        .stats span { font-size: 12.5px; color: var(--muted); }

        /* ---------- 工具条（分类导航 + 搜索） ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255, 255, 255, .88);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 9px 20px;
        }
        .toolbar-inner {
            max-width: 1420px; /* 比内容区宽：一级分类必须单行放下 */
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: space-between;
        }

        /* 一级分类：固定单行不换行，空间不足时横向滑动（任何窗口宽度都只有一行） */
        .nav-primary {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-wrap: nowrap;
            gap: 4px;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            /* 可滑动时右侧渐隐，提示还有内容 */
            -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
            mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
        }
        .nav-primary::-webkit-scrollbar { display: none; }
        /* 空间足够时不要渐隐 */
        .nav-primary.is-fit {
            -webkit-mask-image: none;
            mask-image: none;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 11px;
            border-radius: 999px;
            font-size: 13px;
            color: var(--ink-soft);
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: background .15s, color .15s;
        }
        .nav-link .icon { font-size: 14px; color: var(--faint); }
        .nav-link .n { font-size: 11px; color: var(--faint); }
        .nav-link:hover { background: #f1f3f5; }
        .nav-link:hover .n { color: var(--muted); }
        .nav-link.is-active { background: var(--ink); color: #fff; }
        .nav-link.is-active .icon,
        .nav-link.is-active .n { color: #fff; }

        .search { position: relative; flex: 0 0 auto; padding-top: 1px; }
        .search .icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--faint);
            pointer-events: none;
        }
        .search input {
            width: 226px;
            padding: 8px 30px 8px 32px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            font: inherit;
            font-size: 13px;
            color: var(--ink);
        }
        .search input::placeholder { color: var(--faint); }
        .search input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, .12);
        }
        .search-kbd {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-family: inherit;
            font-size: 11px;
            color: var(--faint);
            background: #f3f4f6;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
            pointer-events: none;
        }
        .search input:focus ~ .search-kbd { opacity: 0; }

        /* ---------- 内容区 ---------- */
        .content { max-width: var(--max-width); margin: 0 auto; padding: 22px 20px 56px; }

        .status {
            margin: 0 0 20px;
            font-size: 13px;
            color: var(--muted);
        }

        .section { margin-bottom: 44px; scroll-margin-top: 76px; }

        .section-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .section-icon {
            width: 40px;
            height: 40px;
            flex: none;
            display: grid;
            place-items: center;
            font-size: 20px;
            border-radius: 12px;
        }
        .section-title h2 {
            margin: 0;
            font-size: 1.22rem;
            letter-spacing: -.01em;
            color: var(--ink);
        }
        .section-title p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

        .subchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .chip {
            font: inherit;
            font-size: 12.5px;
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink-soft);
            cursor: pointer;
            transition: all .15s;
        }
        .chip:hover { border-color: var(--border-strong); background: #fafbfc; }
        .chip.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }
        .chip .n { font-size: 11px; opacity: .55; margin-left: 5px; }

        .grid {
            display: grid;
            /* 最小 340px：保证卡片够宽，简介和标签都能在两行内放下 */
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }
        /* 还没填充卡片的分区先占住两行高度，避免滚动时页面跳动 */
        .grid.is-pending {
            min-height: 600px;
        }

        /* 「更多」卡片：占一个格子，点开展开该分区全部项目 */
        .more-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 200px;
            padding: 20px;
            border: 1px dashed var(--border-strong);
            border-radius: 14px;
            background: linear-gradient(180deg, #fbfcfd, #f4f6f8);
            color: var(--muted);
            font: inherit;
            cursor: pointer;
            transition: border-color .18s, background .18s, color .18s, transform .18s;
        }
        .more-card:hover {
            border-color: var(--brand);
            background: #f0fdf4;
            color: var(--brand);
            transform: translateY(-2px);
        }
        .more-card .more-count {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.1;
        }
        .more-card:hover .more-count { color: var(--brand); }
        .more-card .more-label {
            font-size: 12.5px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            /* 关键：等高时由最高的卡片决定，同行卡片一起拉齐 */
            height: 100%;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(17, 24, 39, .04);
            transition: transform .18s, box-shadow .18s, border-color .18s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(17, 24, 39, .08);
            border-color: var(--border-strong);
        }

        .card-top { display: flex; align-items: flex-start; gap: 10px; }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .card-top > div { min-width: 0; flex: 1; }
        .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
        .card h3 { margin: 0; font-size: 1.02rem; color: var(--ink); line-height: 20px; min-width: 0; }

        /* 仓库行：一个平台一行（GitHub / Gitee），固定两行高保证对齐 */
        .repo-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 34px;
            justify-content: center;
        }
        .repo-item {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            text-decoration: none;
            line-height: 15px;
        }
        .repo-item:hover code { color: var(--brand); text-decoration: underline; }
        .repo-item .src {
            flex: none;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: .2px;
            padding: 1px 6px;
            border-radius: 4px;
            color: #fff;
            line-height: 13px;
        }
        .src-github { background: #24292f; }
        .src-gitee { background: #c71d23; }
        .repo-item code {
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 11.5px;
            color: var(--faint);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .repo-stars {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            color: var(--muted);
            margin-left: auto;
        }
        .repo-stars .icon { font-size: 11px; color: #e0a30a; }

        /* 简介：两行截断，悬停可看全文 */
        .desc {
            margin: 0;
            font-size: 13px;
            line-height: 19px;
            height: 38px;
            color: #4b5563;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 标签：默认最多两行，超出的由脚本收进 +N，点击弹出浮层 */
        .tags {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
        }
        .tags .chip-tag {
            white-space: nowrap;
            flex: none;
            max-width: 132px;          /* 长标签截断，避免一个标签占掉半行 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chip-tag.is-hidden { display: none; }
        .chip-more {
            flex: none;
            border: 0;
            font: inherit;
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #eef0f2;
            color: var(--muted);
            cursor: pointer;
        }
        .chip-more:hover { background: #e5e7eb; color: var(--ink); }

        /* +N 的浮层：列出被收起的标签 */
        .tag-pop {
            position: absolute;
            left: 0;
            bottom: calc(100% + 8px);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 100%;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            box-shadow: 0 12px 28px rgba(17, 24, 39, .16);
            z-index: 25;
        }
        .tag-pop[hidden] { display: none; }

        /* 统计行固定高度：没有数据时也占位，保证下方按钮对齐 */
        .stats-row {
            display: flex;
            gap: 14px;
            align-items: center;
            height: 18px;
            margin: -2px 0 0;
            overflow: hidden;
            white-space: nowrap;
        }
        .stat-item.ver-item {
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 10.5px;
            color: var(--brand);
            background: rgba(21, 128, 61, .08);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .stat-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            color: var(--muted);
        }
        .stat-item .icon { font-size: 13px; color: #c0c4ca; }
        .stat-item:first-child .icon { color: #e0a30a; }
        .stat-item.is-empty { color: #bcc1c8; }
        .stat-item.is-empty .icon { color: #d5d9de; }
        .chip-tag {
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #f3f4f6;
            color: var(--ink-soft);
        }
        .chip-tag.sub { background: #eef2ff; color: #4338ca; }
        .chip-tag.deploy { background: #fdf4ff; color: #a21caf; }

        .card-foot {
            position: relative;       /* 下拉面板以此为定位基准 */
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            margin-top: auto;     /* 关键：按钮永远贴卡片底部，同行卡片横向对齐 */
            padding-top: 2px;
        }

        /* 下载源：双源时是一个开关，点一下切到另一个；单源时是静态标签 */
        .src-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font: inherit;
            font-size: 11px;
            line-height: 16px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--ink-soft);
            cursor: pointer;
            flex: none;
            transition: border-color .15s, background .15s, color .15s;
        }
        .src-toggle:hover {
            border-color: var(--brand);
            background: #f0fdf4;
            color: var(--brand);
        }
        .src-toggle .icon { font-size: 11px; opacity: .7; }
        .src-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: none;
        }
        .src-dot-github { background: #24292f; }
        .src-dot-gitee { background: #c71d23; }
        .src-static {
            font-size: 11.5px;
            color: var(--faint);
        }
        .dl-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
            margin-left: auto;
        }
        .dl-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            justify-content: flex-end;
        }

        /* 有多个安装包时，按钮内嵌一个下拉角标；点按钮先弹面板 */
        .btn-dl.has-menu {
            border: 0;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-dl .dl-caret {
            display: inline-grid;
            place-items: center;
            margin-left: 2px;
            opacity: .85;
        }
        .btn-dl .dl-caret .icon { font-size: 13px; transition: transform .15s; }
        .btn-dl.is-open .dl-caret .icon { transform: rotate(180deg); }

        /* 下拉面板：锚定在卡片底部区域，宽度与卡片内容等宽，永远不溢出 */
        .pkg-menu {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(100% + 8px);
            width: auto;
            max-height: 240px;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            box-shadow: 0 12px 30px rgba(17, 24, 39, .16);
            padding: 4px;
            display: none;
            z-index: 30;
        }
        .pkg-menu.is-open { display: block; }
        .pkg-option {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 8px;
            border: 0;
            border-radius: 7px;
            background: none;
            font: inherit;
            font-size: 12.5px;
            color: var(--ink-soft);
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }
        .pkg-option:hover { background: #f3f4f6; color: var(--ink); }
        .pkg-option .opt-platform {
            flex: none;
            font-size: 9.5px;
            font-weight: 600;
            color: #a21caf;
            background: #fdf4ff;
            padding: 1px 6px;
            border-radius: 4px;
        }
        .pkg-option .opt-name {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: 11.5px;
        }
        .pkg-option .opt-size {
            flex: none;
            font-size: 11px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .ver {
            font-style: normal;
            font-size: 10.5px;
            color: var(--brand);
            background: #f0fdf4;
            border-radius: 4px;
            padding: 1px 5px;
            margin-left: 4px;
        }

        .dl-size {
            font-size: 10.5px;
            opacity: .78;
            margin-left: 2px;
            font-variant-numeric: tabular-nums;
        }

        /* 没有官方编译包时的置灰状态 */
        .btn-dl.is-disabled {
            background: #eef0f2;
            color: #a3a9b1;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-dl.is-disabled .dl-size { opacity: 1; }
        .btn-dl.is-disabled:hover { background: #eef0f2; }

        .license {
            font-size: 11px;
            color: var(--muted);
            background: #fafbfc;
            border: 1px solid var(--border);
            padding: 1px 8px;
            border-radius: 6px;
            white-space: nowrap;
            flex: none;
            line-height: 16px;
            align-self: flex-start;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 34px;             /* 与下拉按钮等高，保证同一行对齐 */
            padding: 0 11px;
            background: var(--brand);
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background .15s;
        }
        .btn .icon { font-size: 15px; }
        .btn:hover { background: var(--brand-hover); }
        .btn { flex: none; white-space: nowrap; }

        /* 下载应用：主操作（实心）；下载源码：次操作（描边） */
        .btn-dl { background: var(--brand); color: #fff; }
        .btn-src {
            background: var(--surface);
            color: var(--ink-soft);
            border: 1px solid var(--border-strong);
        }
        .btn-src:hover { background: #f3f4f6; color: var(--ink); border-color: #b9bec6; }

        .repo-link {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            padding: 6px 4px;
            border-radius: 6px;
        }
        .repo-link:hover { color: var(--brand); }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.9;
            background: var(--surface);
            border: 1px dashed var(--border-strong);
            border-radius: 14px;
        }
        .empty button {
            font: inherit;
            margin-top: 12px;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
        }
        .empty button:hover { background: #f3f4f6; }

        .error {
            padding: 24px;
            background: var(--surface);
            border: 1px solid #f0d5d5;
            border-radius: 14px;
            color: #7a2b2b;
            font-size: 14px;
            line-height: 1.8;
        }
        .error h2 { margin: 0 0 12px; font-size: 1.05rem; color: #8b1a1a; }
        .error p { margin: 0 0 10px; }
        .error pre {
            background: #f6f8fa;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            font-size: 13px;
        }

        .footer {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 26px 20px 40px;
            text-align: center;
            color: var(--faint);
            font-size: 12.5px;
            line-height: 1.9;
        }
        .footer code { color: var(--muted); }

        @media (max-width: 860px) {
            .toolbar-inner { flex-wrap: wrap; }
            .search { width: 100%; }
            .search input { width: 100%; }
        }
        @media (max-width: 520px) {
            .hero { padding: 32px 16px 24px; }
            .hero h1 { font-size: 1.7rem; }
            .logo-mark { width: 52px; height: 52px; font-size: 28px; border-radius: 15px; }
            .content { padding: 18px 14px 44px; }
            .toolbar { padding: 8px 14px; }
            .grid { grid-template-columns: 1fr; }
            .stats { gap: 8px 18px; }
            /* 手机上空间不够时允许换行 */
            .card-foot { flex-wrap: wrap; }
            .desc {
                height: auto;
                -webkit-line-clamp: 3;
                line-height: 1.6;
            }
            .tags { height: auto; flex-wrap: wrap; }
            .repo-row { min-height: 0; }
        }
    </style>
</head>
