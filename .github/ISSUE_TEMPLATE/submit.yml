# 投稿人只填最少的信息：分类用文本框输入中文名，slug 与合法性由 Action 校验。
# 注意：GitHub Issue Forms 的下拉框最多 10 个选项，
# 一级分类 11 个、二级分类 52 个都无法放进 dropdown，因此这里用 textarea + 校验。
name: 收录开源项目
description: 提交后会自动校验并创建收录 PR，作者无需填写 star、更新时间、协议等可自动获取的信息
title: "[收录] "
body:
  - type: markdown
    attributes:
      value: |
        提交后会自动从 GitHub 拉取 star 数、最近更新时间、协议与 Release 信息，并创建收录 PR。
        **你只需要填写下面四项。**

        ---
        **其他类型的问题**：数据有误（star / 更新时间 / 协议标注错了，或项目已删除改名）、
        或者对页面布局、分类体系有建议，请直接新建空白 Issue 描述即可。
        ---

  - type: input
    id: name
    attributes:
      label: 项目名称
      description: 上游仓库的显示名，例如 `NocoDB`
      placeholder: NocoDB
    validations:
      required: true
      length: { min: 1, max: 60 }

  - type: input
    id: repo
    attributes:
      label: 仓库地址
      description: owner/repo 格式，必须是公开可访问的仓库
      placeholder: nocodb/nocodb
    validations:
      required: true
      pattern: '^[\w.-]+\/[\w.-]+$'

  - type: input
    id: category
    attributes:
      label: 所属一级分类
      description: >-
        填写下面 11 个之一（中文名，不要加「类」字）：
        电商、游戏、社交、金融、教育、医疗、企业服务、内容媒体、工具、政务、其他
      placeholder: 工具
    validations:
      required: true
      length: { min: 2, max: 10 }

  - type: input
    id: subcategory
    attributes:
      label: 所属二级分类
      description: >-
        选填。填写该一级分类下的细分类名称（中文），例如「开发工具」「无头电商」。
        拿不准可以留空，审核时会帮你归类。完整清单见 CONTRIBUTING.md。
      placeholder: 开发工具
    validations:
      required: false
      length: { max: 20 }

  - type: textarea
    id: note
    attributes:
      label: 一句话简介
      description: 你自己的话，**不要复制上游 README 原文**。控制在 50 字以内，卡片上会显示两行。
      placeholder: 开源版 Airtable，搭建内部工具最快的一档
    validations:
      required: true
      length: { min: 4, max: 50 }

  - type: input
    id: tech
    attributes:
      label: 技术标签
      description: 逗号分隔，最多 5 个，例如 `React, TypeScript, PostgreSQL`。留空则自动取GitHub 主力语言。
      placeholder: React, TypeScript, PostgreSQL
    validations:
      required: false
      length: { max: 100 }

  - type: dropdown
    id: relation
    attributes:
      label: 你与该项目的关系
      description: 用于判断投稿质量，请如实选择
      options:
        - 我是作者或维护者
        - 我在生产环境使用
        - 我用过，觉得值得推荐
        - 看到觉得不错
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充（可选）
      description: 例如是否有 Gitee 镜像、为什么推荐、已知问题等
    validations:
      required: false
      length: { max: 300 }