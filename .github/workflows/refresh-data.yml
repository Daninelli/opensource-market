name: 刷新仓库数据

# 每天 UTC 03:17 抓一次（避开整点的流量高峰）；也可以在仓库页面手动点 "Run workflow"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # 改动抓取脚本或本工作流时自动跑一次，方便验证链路
  push:
    branches: [main]
    paths:
      - "tools/fetch-repo-data.mjs"
      - "tools/build-trending.mjs"
      - "tools/build-recent.mjs"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 走 REST API：Actions 自带的 GITHUB_TOKEN 额度是 1000 次/小时（按仓库算），
      # 当前 154 个项目只消耗 154 次，绰绰有余；不需要额外生成 PAT。
      - name: 抓取 star / 更新时间
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/fetch-repo-data.mjs

      - name: 生成热门榜
        run: node tools/build-trending.mjs

      - name: 生成最近收录
        run: node tools/build-recent.mjs

      - name: 生成详情页分片
        run: node tools/build-detail.mjs

      - name: 校验数据
        run: node tools/check-data.mjs

      - name: 有变化就提交
        run: |
          if git diff --quiet -- projects.json meta.json trending.json recent.json data/stars-history.json data/detail; then
            echo "数据没有变化，跳过提交"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json meta.json trending.json recent.json data/stars-history.json data/detail
            git commit -m "chore: 更新 star / 更新时间 / 热门榜 / 最近收录 / 详情页（自动）"
            git push
          fi
