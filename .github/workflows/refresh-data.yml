name: 刷新仓库数据

# 每天 UTC 03:17 抓一次（避开整点的流量高峰）；也可以在仓库页面手动点 "Run workflow"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "强制全量重抓（忽略 meta.json 里的 20 小时缓存）"
        type: boolean
        default: false
  # 改动抓取脚本或本工作流时自动跑一次，方便验证链路
  push:
    branches: [main]
    paths:
      - "tools/fetch-repo-data.mjs"
      - "tools/build-trending.mjs"
      - "tools/build-recent.mjs"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

# 同一时间只跑一个刷新任务：两个并发运行会同时消耗同一份 API 配额，
# 也容易在提交阶段互相打断。
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 走 GraphQL 批量：一条查询用别名取 100 个仓库，1699 个项目只要 17 次请求。
      # （GITHUB_TOKEN 的 REST 额度是 1000 次/小时/仓库，逐仓库抓在项目数破千后
      #   必然中途 403，而且会把旧 star 当成新快照写进去——热门榜会静默丢项目。）
      # 仓库改名 / 已删除 / 整批失败时脚本会自动回落到 REST 逐个抓。
      - name: 抓取 star / 更新时间
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/fetch-repo-data.mjs ${{ inputs.all && '--all' || '' }}

      - name: 生成热门榜
        run: node tools/build-trending.mjs

      - name: 生成最近收录
        run: node tools/build-recent.mjs

      - name: 自动判定协议分类
        run: node tools/classify-licenses.mjs

      - name: 追踪项目变动（协议 / 置顶 / 推荐 / 归档）
        run: node tools/track-changes.mjs

      - name: 生成更新日志页数据
        run: node tools/build-changes-feed.mjs

      - name: 生成详情页分片
        run: node tools/build-detail.mjs

      - name: 校验数据
        run: node tools/check-data.mjs

      - name: 有变化就提交
        run: |
          # meta.json 里的 refreshed_at 每次运行都会变，不能拿它判断「有没有变化」，
          # 否则每天都会产生一次没有实际意义的提交。
          if git diff --quiet -- projects.json trending.json recent.json data/stars-history.json data/changes.json data/changes-feed.json data/detail; then
            git checkout -- meta.json 2>/dev/null || true
            echo "数据没有实质变化，跳过提交"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json meta.json trending.json recent.json data/stars-history.json data/changes.json data/changes-feed.json data/detail
            git commit -m "chore: 更新 star / 更新时间和派生数据（自动）"
            git push
          fi
