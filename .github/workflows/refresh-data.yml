name: 刷新仓库数据

# 每天 UTC 03:17 抓一次（避开整点的流量高峰）；也可以在仓库页面手动点 "Run workflow"
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 用 Playwright 抓仓库网页里的 star / 更新时间（不消耗 API 配额）
      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 抓取 star / 更新时间
        run: node tools/fetch-repo-data.mjs

      - name: 校验数据
        run: node tools/check-data.mjs

      - name: 有变化就提交
        run: |
          if git diff --quiet -- projects.json; then
            echo "数据没有变化，跳过提交"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json
            git commit -m "chore: 更新 star / 更新时间（自动）"
            git push
          fi